<!DOCTYPE html><html><head><meta charset='utf-8'><script>performance.setResourceTimingBufferSize(4096)</script><style>body{margin:0;display:flex;flex-wrap:wrap}.tile{width:72px;height:72px}</style></head><body><img class='tile' src='emoji_10_t000.webp'><img class='tile' src='emoji_10_t001.webp'><img class='tile' src='emoji_10_t002.webp'><img class='tile' src='emoji_10_t003.webp'><img class='tile' src='emoji_10_t004.webp'><img class='tile' src='emoji_10_t005.webp'><img class='tile' src='emoji_10_t006.webp'><img class='tile' src='emoji_10_t007.webp'><img class='tile' src='emoji_10_t008.webp'><img class='tile' src='emoji_10_t009.webp'><script>const READY = (async () => {await Promise.all([...document.images].map(i => i.decode()));})();</script>
<script>
window.__done = (async () => {
  await READY;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const mark = performance.now();
  const resources = performance.getEntriesByType('resource')
    .filter(e => e.name.match(/\.(webp|png|jpg|bin)$/))
    .map(e => ({name: e.name.split('/').pop(), transferSize: e.transferSize,
                encodedBodySize: e.encodedBodySize, protocol: e.nextHopProtocol,
                dur: e.duration}));
  return {allVisibleMs: mark, resources, nRendered: document.querySelectorAll('.tile').length};
})();
</script>
</body></html>
