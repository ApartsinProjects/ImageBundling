<svg xmlns='http://www.w3.org/2000/svg' viewBox="0 0 650 566" style="max-width:100%" font-family="Georgia,serif" role="img" aria-label="Construction heuristic decision flow"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5a626c"/></marker></defs><rect x="75" y="9" width="230" height="30" rx="4" fill="#eef2f6" stroke="#14385c"/><text x="190" y="28" font-size="10.5" text-anchor="middle" fill="#111418">directory of images</text><rect x="65" y="57" width="250" height="30" rx="4" fill="#eef2f6" stroke="#14385c"/><text x="190" y="76" font-size="10.5" text-anchor="middle" fill="#111418">collapse exact duplicates &rarr; shared CSS coords</text><rect x="65" y="105" width="250" height="30" rx="4" fill="#eef2f6" stroke="#14385c"/><text x="190" y="124" font-size="10.5" text-anchor="middle" fill="#111418">group by cadence / lossless / dimensions</text><polygon points="190,157 265,184 190,211 115,184" fill="#fdf3e3" stroke="#b9770e"/><text x="190" y="182" font-size="10" text-anchor="middle" fill="#111418">group</text><text x="190" y="193" font-size="10" text-anchor="middle" fill="#111418">&lt; 10 tiles?</text><polygon points="190,241 265,268 190,295 115,268" fill="#fdf3e3" stroke="#b9770e"/><text x="190" y="266" font-size="10" text-anchor="middle" fill="#111418">lossless</text><text x="190" y="277" font-size="10" text-anchor="middle" fill="#111418">required?</text><polygon points="190,324 275,352 190,380 105,352" fill="#fdf3e3" stroke="#b9770e"/><text x="190" y="344" font-size="10" text-anchor="middle" fill="#111418">atlas &lt; bundle</text><text x="190" y="356" font-size="10" text-anchor="middle" fill="#111418">and clears</text><text x="190" y="366" font-size="10" text-anchor="middle" fill="#111418">per-tile floor?</text><rect x="357" y="169" width="190" height="30" rx="4" fill="#f4f5f7" stroke="#5a626c"/><text x="452" y="188" font-size="10.5" text-anchor="middle" fill="#111418">individual files</text><rec